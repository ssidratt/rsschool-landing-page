<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Coffee House — Menu</title>

	<link rel="icon" href="icons/logo.svg">
	<link rel="stylesheet" href="css/style.css">
</head>

<body>

	<header class="header">

		<a href="index.html" class="header-logo">
			<img src="icons/logo.svg" alt="Coffee House Logo">
		</a>

		<nav class="header-nav">

			<ul class="header-nav-list">

				<li class="header-nav-item">
					<a href="index.html#favorite-coffee" class="header-nav-link">
						Favorite coffee
					</a>
				</li>

				<li class="header-nav-item">
					<a href="index.html#about" class="header-nav-link">
						About
					</a>
				</li>

				<li class="header-nav-item">
					<a href="index.html#mobile-app" class="header-nav-link">
						Mobile app
					</a>
				</li>

				<li class="header-nav-item">
					<a href="#contacts" class="header-nav-link">
						Contact us
					</a>
				</li>

			</ul>

		</nav>


		<div class="header-actions">

			<button class="header-theme" type="button" aria-label="Switch theme">
				<img src="icons/Sun.svg" alt="Light theme" class="header-theme-icon-sun">

				<img src="icons/Moon.svg" alt="Dark theme" class="header-theme-icon-moon">
			</button>


			<div class="header-menu-link" aria-current="page">
				Menu

				<img src="icons/coffee-cup.svg" alt="">
			</div>

		</div>


		<button class="header-menu-burger" type="button" aria-label="Open menu" aria-expanded="false"></button>

	</header>



	<main>

		<section class="menu">

			<h1 class="menu-title">
				Behind each of our cups hides an
				<span class="accent">amazing surprise</span>
			</h1>


			<div class="menu-tabs">

				<button class="menu-tabs-button menu-tabs-button-active" type="button" data-tab="coffee">
					<img src="icons/menu/coffee.svg" alt="">

					Coffee
				</button>


				<button class="menu-tabs-button" type="button" data-tab="tea">
					<img src="icons/menu/tea.svg" alt="">

					Tea
				</button>


				<button class="menu-tabs-button" type="button" data-tab="dessert">
					<img src="icons/menu/dessert.svg" alt="">

					Dessert
				</button>

			</div>



			<!-- Coffee cards are generated by JavaScript -->

			<div class="menu-coffee menu-list menu-list-active" data-category="coffee"></div>



			<!-- Tea cards are generated by JavaScript -->

			<div class="menu-tea menu-list" data-category="tea"></div>



			<!-- Dessert cards are generated by JavaScript -->

			<div class="menu-dessert menu-list" data-category="dessert"></div>



			<button class="menu-more-button" type="button" aria-label="Show more menu items">
				<span></span>
			</button>

		</section>

	</main>



	<footer class="footer" id="contacts">

		<div class="footer-offer">

			<h2 class="footer-title">
				Sip, Savor, Smile.
				<span class="accent">It’s coffee time!</span>
			</h2>


			<div class="footer-socials">

				<a href="https://twitter.com/" class="footer-social-link" aria-label="Twitter" target="_blank"
					rel="noopener noreferrer">
					<img src="icons/social/twitter.svg" alt="">
				</a>


				<a href="https://www.instagram.com/" class="footer-social-link" aria-label="Instagram" target="_blank"
					rel="noopener noreferrer">
					<img src="icons/social/instagram.svg" alt="">
				</a>


				<a href="https://www.facebook.com/" class="footer-social-link" aria-label="Facebook" target="_blank"
					rel="noopener noreferrer">
					<img src="icons/social/facebook.svg" alt="">
				</a>

			</div>

		</div>



		<div class="footer-contacts">

			<h3 class="footer-contacts-title">
				Contact us
			</h3>


			<a href="https://www.google.com/maps/search/?api=1&query=8558+Green+Rd,+Los+Angeles"
				class="footer-contacts-address" target="_blank" rel="noopener noreferrer">
				<img src="icons/contacts/pin-alt.svg" alt="">

				8558 Green Rd., LA
			</a>


			<a href="tel:+16035550123" class="footer-contacts-phone">
				<img src="icons/contacts/phone.svg" alt="">

				+1 (603) 555-0123
			</a>


			<p class="footer-contacts-hours">

				<img src="icons/contacts/clock.svg" alt="">

				Mon–Sat: 9:00–23:00
			</p>

		</div>

	</footer>


	<script src="js/products.js"></script>
	<script src="js/script.js"></script>

</body>

</html>
